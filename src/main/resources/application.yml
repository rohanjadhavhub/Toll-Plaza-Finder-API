server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: toll-plaza-finder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/toll_finder}
    username: ${DB_USERNAME:toll_finder}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: 5
  sql:
    init:
      mode: never
finder:
  corridor-meters: ${CORRIDOR_METERS:50}
  cache-maximum-cells: 512
  cache-ttl: 15m
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    geocoding-url: https://maps.googleapis.com/maps/api/geocode/json
    routes-url: https://routes.googleapis.com/directions/v2:computeRoutes
    connect-timeout: 3s
    read-timeout: 10s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    supported-submit-methods: post
    persist-authorization: false
