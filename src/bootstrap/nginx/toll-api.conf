# Install on the EC2 host, not inside the API container.
# Certbot adds HTTPS after DNS points to EC2 and port 80 is reachable.
server {
    listen 80;
    server_name toll-api.rohanjadhav.dev;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Replace client-supplied forwarding headers before Spring processes them.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
